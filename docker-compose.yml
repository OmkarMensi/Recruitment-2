services:

  mysql:
    image: mysql:8.3.0
    container_name: mysql-cont
    restart: unless-stopped
    env_file:
      - ./.env
    networks:
      - my-network
    volumes:
      - vol2:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
      build:
        context: ./backend
        dockerfile: Dockerfile
      container_name: backend-cont
      restart: unless-stopped
      networks:
        - my-network
      depends_on:
          mysql:
            condition: service_healthy
  
  frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile
      container_name: frontend-cont
      restart: unless-stopped
      networks:
        - my-network
      depends_on:
       - backend
      ports:
        - "3000:3000"

volumes:
    vol2:

networks:
    my-network:
      external: true
